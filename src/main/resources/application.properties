spring.application.name=Order-Kafka-Service

server.port=8081

spring.kafka.bootstrap-servers=localhost:9092

# =========================
# PRODUCER
# =========================

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Order Service sends these events
spring.kafka.producer.properties.spring.json.type.mapping=orderCreated:com.org.order.kafka.event.OrderCreatedEvent,orderCancelled:com.org.order.kafka.event.OrderCancelledEvent


# =========================
# CONSUMER
# =========================

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.org.order.kafka.event

spring.kafka.consumer.auto-offset-reset=earliest

# Payment Service events received here
spring.kafka.consumer.properties.spring.json.type.mapping=paymentCompleted:com.org.order.kafka.event.PaymentCompletedEvent,paymentFailed:com.org.order.kafka.event.PaymentFailedEvent